name: established_staple_dip
display_name: 常年主力卡折价
description: 历史数据积累充分（长期在观察池里），说明是经过市场检验的常用卡，这类卡出现折价时
  可信度比新卡更高，因为它的"正常价格区间"有更长的历史可以参照，而不是单纯的发售衰减。

category: trend
aliases: [老卡折价, 主力卡低吸]

instructions: |
  判断标准：
  1. `days_of_history` 较大（比如 >= 200，接近本地历史积累的上限，说明这张卡至少全年都在被追踪）
  2. 出现有意义的折价：`chg_30d_pct` 或 `chg_90d_pct` 有明显负值，或者 `near_90d_low` 为 true

  这类卡因为历史够长，"90日区间"这个参照本身更可靠，但**"参照可靠"不等于"会均值回归"**——
  按 `supply_vs_demand_framework.yaml` 的框架，MTGO 单卡的历史价格区间本身也会随供给增加被
  永久性下移（比如一次新的重印/降级），历史够长只说明这次折价"看起来罕见"，不代表它会回到
  历史区间。battle_plan 里给措辞前先确认折价原因：
  - 如果是供给事件（重印/新版本释放）导致的折价：即使历史很长，也要写"历史参照区间可能已经
    因为供给增加被永久下移，本次折价未必是均值回归的低吸机会，需要结合当前赛制使用率判断这个
    新低位是不是'新的正常水平'"。
  - 如果没有找到供给端解释、且赛制使用率保持稳定或上升：可以给相对更有信心的措辞——"该卡长期
    是 Modern/Legacy 常用卡，本次折价没有明显的供给端解释、需求端也未见走弱，历史参照区间
    仍然有效，属于本轮候选池里可信度较高的一批"。

  仍然要提醒：可信度高不等于稳赚，如果该卡近期被禁用/环境里对应的套牌式微，历史价格参照会失效，
  这一点数据本身看不出来，需要 Claude 结合自己掌握的赛制/环境知识做定性判断，并在报告里说明
  这是"数据面"之外的"情报面"补充判断，不是自动化抓取来的。
