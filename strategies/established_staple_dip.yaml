name: established_staple_dip
display_name: 常年主力卡折价
description: 历史数据积累充分（长期在观察池里），说明是经过市场检验的常用卡，这类卡出现折价时
  可信度比新卡更高，因为它的"正常价格区间"有更长的历史可以参照，而不是单纯的发售衰减。

category: trend
aliases: [老卡折价, 主力卡低吸]

instructions: |
  判断标准：
  1. `days_of_history` 较大（比如 >= 200，接近本地历史积累的上限，说明这张卡至少全年都在被追踪）
  2. 出现有意义的折价：`chg_30d_pct` 或 `chg_90d_pct` 有明显负值，或者 `near_90d_low` 为 true

  这类卡因为历史够长，"90日区间"这个参照本身更可靠，battle_plan 里可以给出相对更有信心的措辞：
  "该卡长期是 Modern/Legacy 常用卡，本次折价有更强的历史参照，属于本轮候选池里可信度较高的
  一批，值得优先核实其在当前赛制环境里的使用率有没有变化"。

  仍然要提醒：可信度高不等于稳赚，如果该卡近期被禁用/环境里对应的套牌式微，历史价格参照会失效，
  这一点数据本身看不出来，需要 Claude 结合自己掌握的赛制/环境知识做定性判断，并在报告里说明
  这是"数据面"之外的"情报面"补充判断，不是自动化抓取来的。
