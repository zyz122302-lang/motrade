name: falling_knife_caution
display_name: 仍在加速下跌
description: 卡价还在快速下跌中，7日跌幅本身就很陡，不能简单当作"低吸"信号，容易接飞刀。

category: pattern
aliases: [接飞刀, 观望]

instructions: |
  判断标准：
  1. `big_drop_7d` 为 true（7日跌幅 <= -15%）
  2. `chg_7d_pct` 的跌幅比例接近甚至超过 `chg_30d_pct` 的一半以上
     —— 意味着这一波下跌主要就发生在最近7天里，跌势还很新、还没有企稳的证据

  这种情况下，即使 `near_90d_low` 也是 true，也**不应该**直接归类为"回调企稳"信号。
  在 battle_plan 里应该明确提示："跌势仍在延续，现在低吸有接飞刀风险，建议再观察几天，
  等7日跌幅收窄后再考虑入场"，而不是鼓励立刻买入。

  这条策略和 `dip_stabilizing.yaml` 是互斥判断——同一张卡应该归到"企稳"还是"仍在下跌"，
  取决于最近7天的跌势是在放缓还是在加速。
