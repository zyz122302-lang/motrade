name: supply_vs_demand_framework
display_name: 供给驱动 vs 需求驱动（MTGO 单卡不是股票）
description: 跨所有分类都要先过一遍的背景框架，不是一个独立的 verdict 标签——判断任何一次
  涨跌之前，先搞清楚驱动它的是供给端事件还是需求端事件，两者对"未来会不会反转"的含义完全相反。

category: framework
aliases: [供给需求框架, 均值回归警惕]

instructions: |
  这条不产出独立的 verdict，是写每一条 note 之前都要先想一遍的背景知识，来自实际观察到的规律：
  **MTGO 单卡大部分的下跌是不可逆的，不会像股票一样"跌多了就有人抄底推回去"**。原因是结构性的：

  1. **供给几乎无限，且由 WotC 单方面控制**：新系列、重印、Secret Lair、跨界联名随时可能给
     一张卡增加新的数字供给，股票的股本是相对固定甚至会回购缩减的，MTGO 单卡没有这个约束。
  2. **bot 是按库存水位机械调价的**，不是公开竞价的双边市场——库存多就压价出货，没有"抄底盘"
     在价格下跌时主动进场托底，跌势是清算曲线，不是情绪化的超跌。
  3. **买家几乎都是要立刻上场打比赛的玩家**，买入动机是"我现在需要这张牌"，不是"我认为它被
     低估了想长期持有"——MTGO 单卡市场里几乎没有股票市场里那种专门做价值投机/长期持有的资金，
     缺了那股天然的逢低买盘。
  4. **Standard 有轮替悬崖**：一张卡跌出 Standard 合法期之后，需求几乎是断崖式永久消失，
     不是周期性的，除非它同时在 Modern/Legacy/Pioneer/Pauper 等永恒赛制里也有一席之地。

  **由此得出的判断原则**：
  - 一次下跌如果能追溯到**供给事件**（新系列发售拆包、某个促销/重印版本释放库存、老系列持续
    redemption 补货），这类下跌"企稳"只代表供给端稀释过程结束，价格在新的、更低的水平上找到了
    平衡，**不代表看多信号**，不应该在 note 里写成"抄底机会"，应该如实写"供给端稀释后企稳，
    维持在新低位，不代表会像股票一样均值回归上涨"。
  - 一次上涨如果能追溯到**需求事件**（赛制合法性变化、解禁、某个新套牌开始大量采用这张卡、
    环境格局变化让这张卡变成关键答案卡），这才是真正可能持续、甚至进一步扩大的信号——因为
    需求池是被实质性扩大了，不是情绪推动的。
  - 反过来，一次上涨如果只是供给收紧（某系列停止补给、redemption 截止日临近）而没有需求端
    变化，涨势的持续性存疑，应该提示"供给收紧型上涨，追高前确认有没有需求端的新理由"。
  - 找不到明确驱动原因（供给还是需求）的异动，如实写"原因未确认"，不要用"技术面企稳=看多"
    这种股票市场的默认假设去填补信息空白——这个默认假设在 MTGO 单卡市场大概率是错的。

  实操上：`dip_stabilizing`/`established_staple_dip` 判断出"跌势放缓"之后，**必须再补一步**——
  这个放缓是供给端稀释完了，还是真的有需求端因素在支撑？前者只写"企稳但仍是新低位，不建议
  当作低吸信号，除非能找到需求端理由"；后者才可以写"企稳+有需求支撑，值得关注"。
