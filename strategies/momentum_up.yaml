name: momentum_up
display_name: 上涨动量
description: 卡价明显走高、接近或创下90日新高，反映需求上升（新套牌/环境变化/供给收紧），
  跟"低吸"信号相反，用于提醒"该卖的时候到了"或者"这张卡热度在起来，别追高买入"。

category: trend
aliases: [上涨, 突破, 追涨提醒]

instructions: |
  判断标准：
  1. `near_90d_high` 为 true（现价接近或创下90日区间高点），或 `big_gain_7d` 为 true（7日涨幅 >= 15%）
  2. `days_of_history` 越大，这个"新高"的参照意义越强（跟 `established_staple_dip.yaml` 同理）

  这类卡在 battle_plan 里的用途和"低吸"信号正好相反：
  - 如果用户持仓里有这张卡：提示"现价明显走高，可以考虑去 bot 那边查一下收购价，评估是否落袋为安"
  - 如果用户没有持仓：提示"该卡正在被市场追捧，现在追涨买入风险较高，除非有明确的环境判断支撑，
    否则不建议作为低吸候选"

  和下跌信号一样，涨价的原因需要 Claude 结合自己对 Modern/Legacy 环境的了解做定性判断，按
  `supply_vs_demand_framework.yaml` 的框架明确区分是**需求驱动**（赛制合法性变化/解禁、环境
  里出现新的强力套牌大量采用这张卡）还是**供给收紧**（某个系列停止补给、redemption 截止日
  临近），这两种原因对"要不要追"的判断影响很大：
  - 需求驱动的涨势更可能持续甚至扩大，因为需求池被实质性扩大了，note 里应该明确点出具体的
    需求催化事件（比如"因为 X 事件首次获得 Y 赛制合法性"）。
  - 单纯供给收紧的涨势持续性存疑——供给面缺口迟早会被市场消化，没有需求端理由支撑的话，
    note 里要提醒"供给收紧型上涨，追高前确认有没有需求端的新理由，缺乏需求支撑的话涨势可能
    随供给恢复而回落"。
  数据本身分不清楚驱动来源，这一步必须由 Claude 做定性判断并写清楚在 note 里。
