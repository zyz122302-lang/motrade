name: momentum_up
display_name: 上涨动量
description: 卡价明显走高、接近或创下90日新高，反映需求上升（新套牌/环境变化/供给收紧），
  跟"低吸"信号相反，用于提醒"该卖的时候到了"或者"这张卡热度在起来，别追高买入"。

category: trend
aliases: [上涨, 突破, 追涨提醒]

instructions: |
  判断标准：
  1. `near_90d_high` 为 true（现价接近或创下90日区间高点），或 `big_gain_7d` 为 true（7日涨幅 >= 15%）
  2. `days_of_history` 越大，这个"新高"的参照意义越强（跟 `established_staple_dip.yaml` 同理）

  这类卡在 battle_plan 里的用途和"低吸"信号正好相反：
  - 如果用户持仓里有这张卡：提示"现价明显走高，可以考虑去 bot 那边查一下收购价，评估是否落袋为安"
  - 如果用户没有持仓：提示"该卡正在被市场追捧，现在追涨买入风险较高，除非有明确的环境判断支撑，
    否则不建议作为低吸候选"

  和下跌信号一样，涨价的原因需要 Claude 结合自己对 Modern/Legacy 环境的了解做定性判断——
  是因为环境里出现了新的强力套牌用到这张卡，还是单纯供给收紧（比如某个系列停止补给/redemption
  截止），这两种原因对"要不要追"的判断影响很大，数据本身分不清楚，要在 note 里说明。
