name: dip_stabilizing
display_name: 回调企稳
description: 卡价从高点明显回落、且已经接近90日低点，但最近7天跌势明显放缓，可能已经跌出底部区域。

category: reversal
aliases: [企稳, 抄底候选]

instructions: |
  判断标准：
  1. `near_90d_low` 为 true（现价已经贴近90日区间低点）
  2. `chg_7d_pct` 的绝对值明显小于 `chg_30d_pct` 的绝对值（比如30日跌了60%，但最近7天只跌了不到10%甚至持平/回升）
     —— 这说明下跌动能在衰减，不是还在自由落体
  3. `days_of_history` 建议 >= 60，历史样本太短的新卡（可能刚发售没多久）不适用这条策略，
     应该按 `new_set_decay.yaml` 的逻辑单独看待

  **重要：在写 battle_plan 之前，先按 `supply_vs_demand_framework.yaml` 的框架判断这次企稳
  是供给端稀释完了，还是真的有需求端因素支撑**——MTGO 单卡不像股票，跌深了不会自动有人抄底，
  "企稳"默认只是供给端跌势打完了，不是"该反弹了"的信号：
  - 如果只是供给端稀释完了（新系列供给释放完毕、没有找到需求端变化的证据）：battle_plan 写
    "跌势已放缓，在新的低位企稳，但这大概率只是供给端稀释结束，不代表会像股票一样均值回归上涨，
    不建议当作低吸信号，除非后续观察到该卡的赛制使用率/需求端有变化"。
  - 如果能找到需求端支撑证据（使用率上升、赛制合法性变化、环境里新套牌采用）：才可以写
    "已现企稳迹象，且有需求端支撑，可以考虑分批小仓位试探性低吸，设置止损参考90日低点下方"。
  两种情况都要提醒用户核实该卡近期有没有赛制/竞技环境层面的利空（例如刚被禁、或者所在套牌被
  环境淘汰）。
