name: new_set_decay
display_name: 新系列发售衰减
description: 刚发售不久的系列，卡价从发售峰值回落是正常现象（补充包持续被拆包导致供给增加），
  不应该当作独立的"低吸信号"，需要等供给曲线走平。

category: framework
aliases: [新卡观望, 发售衰减]

instructions: |
  判断标准：
  1. `days_of_history` 较小（比如 < 60，说明本地积累的历史还很短，大概率是近期发售的系列，
     或者这张卡是最近才达到观察阈值价格的）
  2. 卡价长期趋势是单边下跌（`chg_30d_pct` 和 `chg_90d_pct` 都是较大的负值，且没有像
     `dip_stabilizing.yaml` 里那样出现放缓迹象）

  对于符合这条的卡，battle_plan 里应该明确说明："该卡历史数据积累时间较短，当前下跌更可能是
  系列发售后的正常供给衰减过程，而不是被错杀的低吸机会，建议继续观望、不作为本轮重点关注对象"。

  这条策略的作用主要是**过滤噪音**——避免把"还没跌到底的新卡"和"真正被低估的老卡"混为一谈。
